<!DOCTYPE html><html lang="tr" data-d="auto"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Kumbara">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0E5C63"><title>Kumbara</title>
<style>
:root{--bg:#f3f1ec;--c:#fff;--t:#1c1b19;--m:#78746b;--g:#12805c;--r:#c8382e;--a:#2f6fed;--l:#e6e2d9}
@media(prefers-color-scheme:dark){:root[data-d=auto]{--bg:#141412;--c:#1f1e1b;--t:#f1eee7;--m:#9a958a;--l:#33312c;--g:#3ecf9a;--r:#ff6b5f}}
:root[data-d="1"]{--bg:#141412;--c:#1f1e1b;--t:#f1eee7;--m:#9a958a;--l:#33312c;--g:#3ecf9a;--r:#ff6b5f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
#app{max-width:520px;margin:auto;padding:14px}
h2{font-size:22px;margin:4px 0 12px}h3{font-size:16px;margin:16px 0 8px}
.card{background:var(--c);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--l)}
.big{font-size:34px;font-weight:700;letter-spacing:-1px}.m{color:var(--m);font-size:13px}.in{color:var(--g)}.out{color:var(--r)}
.hero{background:var(--a);color:#fff;border:0}.hero .m{color:#ffffffcc}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--l);cursor:pointer}.it:first-child{border:0}
.it>div{flex:1;min-width:0}.it small{display:block;color:var(--m);font-size:12px}.em{font-size:22px}
.bar{height:8px;background:var(--l);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--a);border-radius:9px}
.b{border:0;background:var(--a);color:#fff;padding:11px 16px;border-radius:12px;font:inherit;font-weight:600}.b.g{background:var(--l);color:var(--t)}.b.d{background:var(--r)}.b.s{padding:7px 12px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--l);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:0;color:var(--m);font:11px inherit;padding:8px 0 6px}nav button span{display:block;font-size:20px}nav .on{color:var(--a);font-weight:700}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;font-size:30px;border:0;background:var(--a);color:#fff;z-index:6;box-shadow:0 4px 14px #0004}
#sh{display:none;position:fixed;inset:0;background:#0007;z-index:9;align-items:flex-end}#sh.on{display:flex}
.bx{background:var(--c);width:100%;max-width:520px;margin:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 0}
input,select{width:100%;font:16px inherit;padding:11px;border:1px solid var(--l);border-radius:12px;background:var(--bg);color:var(--t);margin-top:4px}
.bx .row{margin-top:16px}.bx .b{flex:1}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;max-width:496px;margin:auto;background:var(--t);color:var(--bg);padding:12px 14px;border-radius:14px;z-index:20;display:none}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mn button{border:0;background:var(--c);width:38px;height:38px;border-radius:50%;font-size:20px;color:var(--t)}
.ch{display:inline-block;width:34px;height:34px;border-radius:50%;margin-right:8px;border:3px solid transparent}.ch.on{border-color:var(--t)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 2px;text-align:right;border-top:1px solid var(--l)}td:first-child,th:first-child{text-align:left}
.emp{text-align:center;color:var(--m);padding:18px}
</style></head><body>
<div id="toast"></div><div id="app"></div><button id="fab" onclick="txSheet()">+</button><div id="sh"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),K='birikim_v2',MN=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const D={tx:[],cats:[],pots:[],rec:[],start:[],theme:'#2f6fed',dark:'auto'};
let S=Object.assign({},D,JSON.parse(localStorage.getItem(K)||'{}'));
const save=()=>localStorage.setItem(K,JSON.stringify(S)),uid=()=>Math.random().toString(36).slice(2,9);
(function(){if(localStorage.getItem(K))return;try{const o=JSON.parse(localStorage.getItem('kumbara-demo-v1')||'null');if(!o||o.demo||!Array.isArray(o.entries))return;
const E={Market:'🛒',Yemek:'🍔',Alışveriş:'🛍️',Kira:'🏠',Ulaşım:'🚗',Fatura:'💡',Eğlence:'🎬',Sağlık:'💊',Maaş:'💼','Ek gelir':'➕'},ids={},cs=[];
const add=(type,n)=>{const c={id:uid(),type,e:E[n]||(type=='in'?'💰':'🏷️'),n,bud:type=='out'?(o.budgets[n]||0)/100:0};cs.push(c);ids[type+n]=c.id};
o.cats.gelir.forEach(n=>add('in',n));o.cats.gider.forEach(n=>add('out',n));
const tx=o.entries.map(e=>{const ty=e.type=='gelir'?'in':'out';return{id:uid(),type:ty,amt:e.amount/100,cat:ids[ty+e.cat]||'',date:e.date,note:e.note||''}});
S=Object.assign({},D,{cats:cs,tx,start:o.start?[{id:uid(),n:'Başlangıç',amt:o.start/100}]:[],pots:o.goal&&o.goal.target>0?[{id:uid(),e:'🎯',n:o.goal.name||'Hedefim',target:o.goal.target/100,saved:0}]:[]});save()}catch(e){}})();

const f=n=>(+n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'}),num=s=>parseFloat(String(s).replace(',','.'))||0;
const esc=s=>String(s??'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const sum=a=>a.reduce((s,x)=>s+x,0),sg=t=>t.type=='in'?t.amt:-t.amt,mo=t=>t.date.slice(0,7);
let v='home',cur=td().slice(0,7),yr=+td().slice(0,4);
const cat=id=>S.cats.find(c=>c.id==id),cn=t=>{const c=cat(t.cat);return c?c.e+' '+c.n:'📦 Kategorisiz'};
const inM=m=>S.tx.filter(t=>mo(t)==m),tot=(a,ty)=>sum(a.filter(t=>t.type==ty).map(t=>t.amt));
const spent=(c,m)=>sum(inM(m).filter(t=>t.type=='out'&&t.cat==c).map(t=>t.amt));
const carry=m=>sum(S.start.map(x=>+x.amt))+sum(S.tx.filter(t=>mo(t)<m).map(sg));
function avg(){const r=td().slice(0,7),ms={};S.tx.forEach(t=>ms[mo(t)]=(ms[mo(t)]||0)+sg(t));const p=Object.keys(ms).filter(m=>m<r).map(m=>ms[m]);const a=p.length?p:(r in ms?[ms[r]]:[]);return a.length?sum(a)/a.length:0}
function cm(c,m){if(!(c.bud>0))return'';const s=spent(c.id,m),b=+c.bud;return s>b?`⚠️ ${f(s-b)} fazla harcadın`:s>=b*.8?`Dikkat: bütçenin %${Math.round(s/b*100)}'ini kullandın, ${f(b-s)} kaldı`:`✅ Bütçenin altındasın, ${f(b-s)} kaldı`}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4500)}
function close(){$('#sh').className=''}
function sheet(title,fl,ok,del){
$('#sh').innerHTML=`<div class=bx><h3>${title}</h3>${fl.map(x=>`<label>${x.l}${x.o?`<select id="f_${x.k}">${x.o.map(o=>`<option value="${esc(o[0])}"${o[0]==x.v?' selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id="f_${x.k}" ${x.t=='amt'?'type=text inputmode=decimal':`type=${x.t||'text'}`} value="${esc(x.v)}">`}</label>`).join('')}<div class=row><button class=b id=ok>Kaydet</button>${del?'<button class="b d" id=dl>Sil</button>':''}<button class="b g" id=cl>İptal</button></div></div>`;
$('#sh').className='on';$('#cl').onclick=close;
$('#ok').onclick=()=>{const o={};fl.forEach(x=>o[x.k]=$('#f_'+x.k).value);if(ok(o)!==false){save();close();R()}};
if(del)$('#dl').onclick=()=>{if(confirm('Silinsin mi?')){del();save();close();R()}}}
function txSheet(t){t=t||{type:'out',date:td(),amt:'',cat:'',note:''};
const op=ty=>[['','— Kategori seç —'],...S.cats.filter(c=>c.type==ty).map(c=>[c.id,c.e+' '+c.n])];
sheet(t.id?'İşlemi düzenle':'Yeni işlem',[{k:'type',l:'Tür',o:[['out','Gider'],['in','Gelir']],v:t.type},{k:'amt',l:'Tutar (€)',t:'amt',v:t.amt},{k:'cat',l:'Kategori (Bütçe sekmesinden eklenir)',o:op(t.type),v:t.cat},{k:'date',l:'Tarih',t:'date',v:t.date},{k:'note',l:'Not',v:t.note}],o=>{
const a=num(o.amt);if(!a)return alert('Tutar gir'),false;
const n={id:t.id||uid(),type:o.type,amt:a,cat:o.cat,date:o.date||td(),note:o.note,rid:t.rid};
if(t.id)S.tx[S.tx.findIndex(x=>x.id==t.id)]=n;else S.tx.push(n);
const c=cat(n.cat);if(n.type=='out'&&c&&c.bud>0){const m=n.date.slice(0,7),r=c.bud-spent(c.id,m);setTimeout(()=>toast(`${c.e} ${c.n}: ${r>=0?f(r)+' harcayabilirsin':f(-r)+' bütçeyi aştın'}. ${cm(c,m)}`),50)}
},t.id&&(()=>{S.tx=S.tx.filter(x=>x.id!=t.id)}));
$('#f_type').onchange=e=>$('#f_cat').innerHTML=op(e.target.value).map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}
const eT=id=>txSheet(S.tx.find(x=>x.id==id));
function row(t){return`<div class=it onclick="eT('${t.id}')"><span class=em>${(cat(t.cat)||{e:'📦'}).e}</span><div><b>${esc(cn(t).slice(2))}</b><small>${t.date.split('-').reverse().join('.')}${t.note?' · '+esc(t.note):''}</small></div><b class="${t.type}">${t.type=='in'?'+':'−'}${f(t.amt)}</b></div>`}
function mnav(){const[y,m]=cur.split('-').map(Number);return`<div class=mn><button onclick="mv(-1)">‹</button><b>${MN[m-1]} ${y}</b><button onclick="mv(1)">›</button></div>`}
function mv(d){let[y,m]=cur.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}cur=y+'-'+String(m).padStart(2,'0');R()}
function home(){const a=inM(cur),i=tot(a,'in'),o=tot(a,'out'),c=carry(cur),bc=S.cats.filter(x=>x.type=='out'&&x.bud>0),tb=sum(bc.map(x=>+x.bud)),ts=sum(bc.map(x=>spent(x.id,cur))),ov=bc.filter(x=>spent(x.id,cur)>x.bud);
return mnav()+`<div class="card hero"><div class=m>Önceki aylardan birikmiş para</div><div class=big>${f(c)}</div><div class=m>Bu aya eklenmez. Ay sonunda kalan para buna eklenir.</div></div>
<div class=g2><div class=card><div class=m>Gelir</div><b class=in>${f(i)}</b></div><div class=card><div class=m>Gider</div><b class=out>${f(o)}</b></div></div>
<div class=card><div class=m>Bu ay elimde kalan</div><div class=big>${f(i-o)}</div><div class=m>Ay sonu toplam birikim: <b>${f(c+i-o)}</b></div></div>
<div class=card><b>Bütçe özeti</b><div class=m style="margin-top:6px">${bc.length?(ts>tb?`⚠️ Toplam bütçeyi ${f(ts-tb)} aştın.`:`✅ Bütçenin altındasın, ${f(tb-ts)} payın var.`)+ov.map(x=>`<br>⚠️ ${x.e} ${esc(x.n)}: ${f(spent(x.id,cur)-x.bud)} fazla`).join(''):'Bütçe sekmesinden kategori ve bütçe ekle.'}</div></div>
<h3>Son işlemler</h3><div class=card>${a.length?a.sort((x,y)=>y.date.localeCompare(x.date)).slice(0,5).map(row).join(''):'<div class=emp>Bu ay işlem yok. + ile ekle.</div>'}</div>`}
let tm='cat',op={};
function txs(){const a=inM(cur).sort((x,y)=>y.date.localeCompare(x.date));
const h=mnav()+`<h2>İşlemler</h2><div class=row style="margin-bottom:10px"><button class="b s ${tm=='cat'?'':'g'}" onclick="tm='cat';R()">Kategoriye göre</button><button class="b s ${tm=='date'?'':'g'}" onclick="tm='date';R()">Tarihe göre</button></div>`;
if(!a.length)return h+'<div class="card emp">Bu ay işlem yok.</div>';
if(tm=='date')return h+`<div class=card>${a.map(row).join('')}</div>`;
const G={};a.forEach(t=>{const k=(t.cat||'x')+t.type;(G[k]=G[k]||[]).push(t)});
return h+Object.entries(G).map(([k,l])=>({k,l,t:l[0].type,s:sum(l.map(t=>t.amt))})).sort((x,y)=>(x.t=='out'?0:1)-(y.t=='out'?0:1)||y.s-x.s).map(({k,l,t,s})=>`<div class=card><div class="row sp" style="cursor:pointer" onclick="op['${k}']=!op['${k}'];R()"><b>${cn(l[0])} <span class=m>(${l.length})</span></b><span><b class="${t}">${t=='in'?'+':'−'}${f(s)}</b> <span class=m>${op[k]?'▲':'▼'}</span></span></div>${op[k]?`<div style="margin-top:8px">${l.map(row).join('')}</div>`:''}</div>`).join('')}
const TPL=[['out','🏠','Kira',500],['out','🛒','Market',200],['out','🍔','Dışarıda yemek',80],['out','🚗','Ulaşım',60],['out','🛍️','Alışveriş',50],['out','💡','Faturalar',100],['out','🎬','Eğlence',40],['out','💊','Sağlık',30],['in','💼','Maaş',0],['in','➕','Ek gelir',0],['in','🎁','Hediye',0]];
function tpl(){TPL.forEach(([type,e,n,bud])=>{if(!S.cats.some(c=>c.n==n))S.cats.push({id:uid(),type,e,n,bud})});save();R()}
function cSheet(id){const c=id?cat(id):{type:'out',e:'🛒',n:'',bud:''};
sheet(id?'Kategoriyi düzenle':'Yeni kategori',[{k:'n',l:'İsim',v:c.n},{k:'e',l:'Emoji',v:c.e},{k:'type',l:'Tür',o:[['out','Gider'],['in','Gelir']],v:c.type},{k:'bud',l:'Aylık bütçe (€, sadece gider)',t:'amt',v:c.bud}],o=>{if(!o.n.trim())return false;const n={id:c.id||uid(),n:o.n.trim(),e:o.e||'📦',type:o.type,bud:num(o.bud)};if(id)S.cats[S.cats.findIndex(x=>x.id==id)]=n;else S.cats.push(n)},id&&(()=>{S.cats=S.cats.filter(x=>x.id!=id)}))}
function rSheet(id){const r=id?S.rec.find(x=>x.id==id):{n:'',type:'out',amt:'',cat:'',day:1,on:'1'};
sheet(id?'Tekrarlayanı düzenle':'Tekrarlayan işlem',[{k:'n',l:'İsim (ör. Kira)',v:r.n},{k:'type',l:'Tür',o:[['out','Gider'],['in','Gelir']],v:r.type},{k:'amt',l:'Tutar (€)',t:'amt',v:r.amt},{k:'cat',l:'Kategori',o:[['','—'],...S.cats.map(c=>[c.id,c.e+' '+c.n])],v:r.cat},{k:'day',l:'Ayın günü (1-28)',t:'number',v:r.day},{k:'on',l:'Durum',o:[['1','Aktif'],['0','Duraklatıldı']],v:r.on}],o=>{if(!o.n.trim()||!num(o.amt))return false;const n={id:r.id||uid(),n:o.n.trim(),type:o.type,amt:num(o.amt),cat:o.cat,day:Math.min(28,Math.max(1,+o.day||1)),on:o.on,from:r.from||td().slice(0,7)};if(id)S.rec[S.rec.findIndex(x=>x.id==id)]=n;else S.rec.push(n);applyRec()},id&&(()=>{S.rec=S.rec.filter(x=>x.id!=id)}))}
function applyRec(){const t=td(),c=t.slice(0,7);S.rec.filter(r=>r.on=='1').forEach(r=>{let[y,m]=r.from.split('-').map(Number);for(;;){const mm=y+'-'+String(m).padStart(2,'0');if(mm>c)break;const d=mm+'-'+String(r.day).padStart(2,'0');if(d<=t&&!S.tx.some(x=>x.rid==r.id&&mo(x)==mm))S.tx.push({id:uid(),type:r.type,amt:r.amt,cat:r.cat,date:d,note:r.n+' 🔁',rid:r.id});if(++m>12){m=1;y++}}});save()}
function bud(){const ex=S.cats.filter(c=>c.type=='out'),inc=S.cats.filter(c=>c.type=='in');
return mnav()+`<h2>Bütçe</h2><div class=row><button class="b s" onclick="cSheet()">+ Kategori</button><button class="b s g" onclick="tpl()">Taslak ekle</button></div><h3>Gider kategorileri</h3>`+(ex.length?ex.map(c=>{const s=spent(c.id,cur),p=c.bud>0?Math.min(100,s/c.bud*100):0;return`<div class=card onclick="cSheet('${c.id}')"><div class="row sp"><b>${c.e} ${esc(c.n)}</b><span class=m>${f(s)} / ${c.bud>0?f(c.bud):'bütçe yok'}</span></div>${c.bud>0?`<div class=bar><i style="width:${p}%;${s>c.bud?'background:var(--r)':''}"></i></div><div class=m>${cm(c,cur)}</div>`:''}</div>`}).join(''):'<div class="card emp">Henüz kategori yok. “+ Kategori” ile kendin ekle ya da “Taslak ekle” ile hazır liste al, sonra düzenle.</div>')+(inc.length?`<h3>Gelir kategorileri</h3><div class=card>${inc.map(c=>`<div class=it onclick="cSheet('${c.id}')"><span class=em>${c.e}</span><div>${esc(c.n)}</div></div>`).join('')}</div>`:'')+`<h3>🔁 Tekrarlayan işlemler</h3><div class=card>${S.rec.map(r=>`<div class=it onclick="rSheet('${r.id}')"><div><b>${esc(r.n)}</b><small>Her ayın ${r.day}. günü${r.on=='1'?'':' · duraklatıldı'}</small></div><b class="${r.type}">${f(r.amt)}</b></div>`).join('')||'<div class=emp>Yok</div>'}<button class="b s" style="margin-top:8px" onclick="rSheet()">+ Tekrarlayan ekle</button></div>`}
function pSheet(id){const p=id?S.pots.find(x=>x.id==id):{e:'🎯',n:'',target:'',saved:0};
sheet(id?'Kumbarayı düzenle':'Yeni kumbara',[{k:'n',l:'İsim',v:p.n},{k:'e',l:'Emoji',v:p.e},{k:'target',l:'Hedef (€)',t:'amt',v:p.target},{k:'saved',l:'İçindeki para (€)',t:'amt',v:p.saved}],o=>{if(!o.n.trim())return false;const n={id:p.id||uid(),n:o.n.trim(),e:o.e||'🎯',target:num(o.target),saved:num(o.saved)};if(id)S.pots[S.pots.findIndex(x=>x.id==id)]=n;else S.pots.push(n)},id&&(()=>{S.pots=S.pots.filter(x=>x.id!=id)}))}
function mSheet(id){const p=S.pots.find(x=>x.id==id);sheet(p.e+' '+p.n+': para ekle/çıkar',[{k:'d',l:'İşlem',o:[['1','Kumbaraya ekle'],['-1','Kumbaradan çıkar']],v:'1'},{k:'a',l:'Tutar (€)',t:'amt',v:''}],o=>{const a=num(o.a)*o.d;if(!a)return false;if(a>0&&a>free()&&!confirm('Serbest birikimin yetmiyor, yine de eklensin mi?'))return false;p.saved=Math.max(0,p.saved+a)})}
const pool=()=>carry(td().slice(0,7)),free=()=>pool()-sum(S.pots.map(p=>+p.saved));
function pots(){const a=avg(),al=sum(S.pots.map(p=>+p.saved));
