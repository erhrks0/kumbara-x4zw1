<!DOCTYPE html><html lang="tr" data-d="auto"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Kumbara">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0E5C63"><title>Kumbara</title>
<style>
:root{--bg:#f3f1ec;--c:#fff;--t:#1c1b19;--m:#78746b;--g:#12805c;--r:#c8382e;--a:#2f6fed;--l:#e6e2d9}
@media(prefers-color-scheme:dark){:root[data-d=auto]{--bg:#141412;--c:#1f1e1b;--t:#f1eee7;--m:#9a958a;--l:#33312c;--g:#3ecf9a;--r:#ff6b5f}}
:root[data-d="1"]{--bg:#141412;--c:#1f1e1b;--t:#f1eee7;--m:#9a958a;--l:#33312c;--g:#3ecf9a;--r:#ff6b5f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
#app{max-width:520px;margin:auto;padding:14px}
h2{font-size:22px;margin:4px 0 12px}h3{font-size:16px;margin:16px 0 8px}
.card{background:var(--c);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--l)}
.big{font-size:34px;font-weight:700;letter-spacing:-1px}.m{color:var(--m);font-size:13px}.in{color:var(--g)}.out{color:var(--r)}
.hero{background:var(--a);color:#fff;border:0}.hero .m{color:#ffffffcc}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--l);cursor:pointer}.it:first-child{border:0}
.it>div{flex:1;min-width:0}.it small{display:block;color:var(--m);font-size:12px}.em{font-size:22px}
.bar{height:8px;background:var(--l);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--a);border-radius:9px}
.b{border:0;background:var(--a);color:#fff;padding:11px 16px;border-radius:12px;font:inherit;font-weight:600}.b.g{background:var(--l);color:var(--t)}.b.d{background:var(--r)}.b.s{padding:7px 12px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--l);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:0;color:var(--m);font-size:11px;font-family:inherit;padding:8px 0 6px}nav button span{display:block;font-size:20px}nav .on{color:var(--a);font-weight:700}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;font-size:30px;border:0;background:var(--a);color:#fff;z-index:6;box-shadow:0 4px 14px #0004}
#sh{display:none;position:fixed;inset:0;background:#0007;z-index:9;align-items:flex-end}#sh.on{display:flex}
.bx{background:var(--c);width:100%;max-width:520px;margin:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 0}
input,select{width:100%;font-size:16px;font-family:inherit;padding:11px;border:1px solid var(--l);border-radius:12px;background:var(--bg);color:var(--t);margin-top:4px}
.bx .row{margin-top:16px}.bx .b{flex:1}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;max-width:496px;margin:auto;background:var(--t);color:var(--bg);padding:12px 14px;border-radius:14px;z-index:20;display:none}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mn button{border:0;background:var(--c);width:38px;height:38px;border-radius:50%;font-size:20px;color:var(--t)}
.ch{display:inline-block;width:34px;height:34px;border-radius:50%;margin-right:8px;border:3px solid transparent}.ch.on{border-color:var(--t)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 2px;text-align:right;border-top:1px solid var(--l)}td:first-child,th:first-child{text-align:left}
.emp{text-align:center;color:var(--m);padding:18px}
.warn{border:2px solid var(--r);background:color-mix(in srgb,var(--r) 12%,var(--c))}.ck label{display:flex;align-items:center;gap:8px;color:var(--t);font-size:16px;margin:6px 0}.ck input{width:auto;margin:0}.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;border:0;background:0;padding:10px;border-radius:10px;font-size:16px;font-family:inherit;color:var(--m);font-weight:600}.seg .on{background:var(--c);color:var(--t);box-shadow:0 1px 4px #0003}.amt{font-size:30px!important;font-weight:700;text-align:center}.chs{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--l);background:var(--bg);color:var(--t);padding:9px 13px;border-radius:20px;font-size:15px;font-family:inherit}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}</style></head><body>
<div id="toast"></div><div id="app"></div><button id="fab" onclick="txSheet()">+</button><div id="sh"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),K='birikim_v2',MN=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const D={mb:{},led:[],grp:[],tx:[],cats:[],pots:[],rec:[],start:[],theme:'#2f6fed',dark:'auto'};
let S=Object.assign({},D,JSON.parse(localStorage.getItem(K)||'{}'));
const save=()=>localStorage.setItem(K,JSON.stringify(S)),uid=()=>Math.random().toString(36).slice(2,9);
(function(){if(localStorage.getItem(K))return;try{const o=JSON.parse(localStorage.getItem('kumbara-demo-v1')||'null');if(!o||o.demo||!Array.isArray(o.entries))return;
const E={Market:'🛒',Yemek:'🍔',Alışveriş:'🛍️',Kira:'🏠',Ulaşım:'🚗',Fatura:'💡',Eğlence:'🎬',Sağlık:'💊',Maaş:'💼','Ek gelir':'➕'},ids={},cs=[];
const add=(type,n)=>{const c={id:uid(),type,e:E[n]||(type=='in'?'💰':'🏷️'),n,bud:type=='out'?(o.budgets[n]||0)/100:0};cs.push(c);ids[type+n]=c.id};
o.cats.gelir.forEach(n=>add('in',n));o.cats.gider.forEach(n=>add('out',n));
const tx=o.entries.map(e=>{const ty=e.type=='gelir'?'in':'out';return{id:uid(),type:ty,amt:e.amount/100,cat:ids[ty+e.cat]||'',date:e.date,note:e.note||''}});
S=Object.assign({},D,{cats:cs,tx,start:o.start?[{id:uid(),n:'Başlangıç',amt:o.start/100}]:[],pots:o.goal&&o.goal.target>0?[{id:uid(),e:'🎯',n:o.goal.name||'Hedefim',target:o.goal.target/100,saved:0}]:[]});save()}catch(e){}})();

const f=n=>(+n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'}),num=s=>parseFloat(String(s).replace(',','.'))||0;
const esc=s=>String(s??'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const sum=a=>a.reduce((s,x)=>s+x,0),sg=t=>t.type=='in'?t.amt:-t.amt,mo=t=>t.date.slice(0,7);
let v='home',cur=td().slice(0,7),yr=+td().slice(0,4);
const cat=id=>S.cats.find(c=>c.id==id),cn=t=>{const c=cat(t.cat);return c?c.e+' '+c.n:'📦 Kategorisiz'};
const inM=m=>S.tx.filter(t=>mo(t)==m),tot=(a,ty)=>sum(a.filter(t=>t.type==ty).map(t=>t.amt));
const spent=(c,m)=>sum(inM(m).filter(t=>t.type=='out'&&t.cat==c).map(t=>t.amt));
const carry=m=>sum(S.start.map(x=>+x.amt))+sum(S.tx.filter(t=>mo(t)<m).map(sg));
function avg(){const r=td().slice(0,7),ms={};S.tx.forEach(t=>ms[mo(t)]=(ms[mo(t)]||0)+sg(t));const p=Object.keys(ms).filter(m=>m<r).map(m=>ms[m]);const a=p.length?p:(r in ms?[ms[r]]:[]);return a.length?sum(a)/a.length:0}
function cm(c,m){const b=bg(c,m);if(!(b>0))return'';const s=spent(c.id,m);return s>b?`⚠️ ${f(s-b)} fazla harcadın`:s>=b*.8?`Dikkat: bütçenin %${Math.round(s/b*100)}'ini kullandın, ${f(b-s)} kaldı`:`✅ Bütçenin altındasın, ${f(b-s)} kaldı`}
function toast(t,bad){const e=$('#toast');e.textContent=t;e.style.background=bad?'var(--r)':'var(--t)';e.style.color=bad?'#fff':'var(--bg)';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',bad?8000:4500)}
function close(){$('#sh').className=''}
$('#sh').addEventListener('click',e=>{if(e.target.id=='sh')close()});
function sheet(title,fl,ok,del){
$('#sh').innerHTML=`<div class=bx><h3>${title}</h3>${fl.map(x=>x.ck?`<div class=m style="margin-top:10px">${x.l}</div><div id="f_${x.k}" class=ck>${x.ck.map(n=>`<label><input type=checkbox value="${esc(n)}"${x.v.includes(n)?' checked':''}>${esc(n)}</label>`).join('')}</div>`:`<label>${x.l}${x.o?`<select id="f_${x.k}">${x.o.map(o=>`<option value="${esc(o[0])}"${o[0]==x.v?' selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id="f_${x.k}" ${x.t=='amt'?'type=text inputmode=decimal':`type=${x.t||'text'}`} value="${esc(x.v)}">`}</label>`).join('')}<div class=row><button class=b id=ok>Kaydet</button>${del?'<button class="b d" id=dl>Sil</button>':''}<button class="b g" id=cl>İptal</button></div></div>`;
$('#sh').className='on';$('#cl').onclick=close;
$('#ok').onclick=()=>{const o={};fl.forEach(x=>o[x.k]=x.ck?[...document.querySelectorAll('#f_'+x.k+' input:checked')].map(i=>i.value):$('#f_'+x.k).value);if(ok(o)!==false){save();close();R()}};
if(del)$('#dl').onclick=()=>{if(confirm('Silinsin mi?')){del();save();close();R()}}}
function txSheet(id){const t0=id&&S.tx.find(x=>x.id==id)||{type:'out',date:td(),amt:'',cat:'',note:''};let ty=t0.type,ct=t0.cat;
const dr=()=>{$('#t_out').className=ty=='out'?'on':'';$('#t_in').className=ty=='in'?'on':'';$('#chs').innerHTML=(S.cats.length?'':'<button class=chip data-c=tpl>✨ Hazır kategorileri ekle</button>')+S.cats.filter(c=>c.type==ty).map(c=>`<button class="chip${c.id==ct?' on':''}" data-c="${c.id}">${c.e} ${esc(c.n)}</button>`).join('')+'<button class=chip data-c=new>＋ Yeni</button>'};
$('#sh').innerHTML=`<div class=bx><div class=seg><button id=t_out>Gider</button><button id=t_in>Gelir</button></div><input id=f_amt class=amt type=text inputmode=decimal placeholder="0,00 €" value="${esc(t0.amt)}"><div class=m style="margin:12px 0 6px">Kategori</div><div id=chs class=chs></div><label>Not (isteğe bağlı)<input id=f_note value="${esc(t0.note)}"></label><label>Tarih<input id=f_date type=date value="${t0.date}"></label><div class=row><button class=b id=ok>Kaydet</button>${id?'<button class="b d" id=dl>Sil</button>':''}<button class="b g" id=cl>İptal</button></div></div>`;
$('#sh').className='on';dr();
$('#t_out').onclick=()=>{ty='out';ct='';dr()};$('#t_in').onclick=()=>{ty='in';ct='';dr()};
$('#chs').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.c;if(k=='tpl'){TPL.forEach(([type,em,n,bud])=>{if(!S.cats.some(c=>c.n==n))S.cats.push({id:uid(),type,e:em,n,bud})});save()}else if(k=='new'){const n=(prompt('Kategori adı?')||'').trim();if(!n)return;const c={id:uid(),type:ty,e:ty=='in'?'💰':'🏷️',n,bud:0};S.cats.push(c);save();ct=c.id}else ct=k;dr()};
$('#cl').onclick=close;
$('#ok').onclick=()=>{const a=num($('#f_amt').value);if(!a)return alert('Tutarı gir');const n={id:t0.id||uid(),type:ty,amt:a,cat:ct,date:$('#f_date').value||td(),note:$('#f_note').value,rid:t0.rid};if(id)S.tx[S.tx.findIndex(x=>x.id==id)]=n;else S.tx.push(n);save();close();R();const c=cat(n.cat),m=n.date.slice(0,7);if(n.type=='out'&&c&&bg(c,m)>0){const r=bg(c,m)-spent(c.id,m);toast(`${r<0?'🚨 ':''}${c.e} ${c.n}: ${r>=0?f(r)+' harcayabilirsin.':f(-r)+' bütçeyi aştın!'} ${cm(c,m)}`,r<0)}};
if(id)$('#dl').onclick=()=>{if(confirm('Silinsin mi?')){S.tx=S.tx.filter(x=>x.id!=id);save();close();R()}}}
const eT=id=>txSheet(id);
function row(t){return`<div class=it onclick="eT('${t.id}')"><span class=em>${(cat(t.cat)||{e:'📦'}).e}</span><div><b>${esc(cn(t).slice(2))}</b><small>${t.date.split('-').reverse().join('.')}${t.note?' · '+esc(t.note):''}</small></div><b class="${t.type}">${t.type=='in'?'+':'−'}${f(t.amt)}</b></div>`}
function mnav(){const[y,m]=cur.split('-').map(Number);return`<div class=mn><button onclick="mv(-1)">‹</button><b>${MN[m-1]} ${y}</b><button onclick="mv(1)">›</button></div>`}
function mv(d){let[y,m]=cur.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}cur=y+'-'+String(m).padStart(2,'0');R()}
const sm=(m,d)=>{let[y,k]=m.split('-').map(Number);k+=d;while(k<1){k+=12;y--}while(k>12){k-=12;y++}return y+'-'+String(k).padStart(2,'0')};
const bg=(c,m)=>{const o=(S.mb||{})[m];return o&&c.id in o?+o[c.id]:+c.bud||0};
const wn=ov=>ov.length?`<div class="card warn"><b>🚨 Bütçe aşıldı</b>${ov.map(x=>`<div>${x.e} ${esc(x.n)}: <b class=out>${f(spent(x.id,cur)-bg(x,cur))}</b> fazla</div>`).join('')}</div>`:'';
function cmp(){const p=sm(cur,-1),a=inM(cur),b=inM(p);if(!b.length)return'';const ci=tot(a,'in'),co=tot(a,'out'),pi=tot(b,'in'),po=tot(b,'out'),d=co-po,ex=S.cats.filter(c=>c.type=='out').map(c=>({c,x:spent(c.id,cur)-spent(c.id,p)})).sort((x,y)=>y.x-x.x),up=ex[0],dn=ex[ex.length-1];
return`<div class=card><b>Geçen ayla karşılaştır</b> <span class=m>(${MN[+p.slice(5)-1]})</span><table style="margin-top:6px"><tr><th><th>Bu ay<th>Geçen ay<th>Fark</tr>${[['Gelir',ci,pi,1],['Gider',co,po,-1],['Kalan',ci-co,pi-po,1]].map(([n,x,y,z])=>`<tr><td>${n}<td>${f(x)}<td>${f(y)}<td class="${(x-y)*z>=0?'in':'out'}">${x-y>=0?'+':'−'}${f(Math.abs(x-y))}</tr>`).join('')}</table><div class=m style="margin-top:6px">${d>0?`Geçen aya göre ${f(d)} fazla harcadın.`:d<0?`Geçen aya göre ${f(-d)} az harcadın 👏`:'Giderlerin geçen ayla aynı.'}${up&&up.x>0?` En çok artan: ${up.c.e} ${esc(up.c.n)} (+${f(up.x)}).`:''}${dn&&dn.x<0?` En çok azalan: ${dn.c.e} ${esc(dn.c.n)} (−${f(-dn.x)}).`:''}</div></div>`}
function bSheet(id){const c=cat(id),o=(S.mb[cur]||{})[id]!==undefined,pb=bg(c,sm(cur,-1));
sheet(`${c.e} ${c.n}: bütçe`,[{k:'a',l:`Bütçe (€)${pb?' · geçen ay: '+f(pb):''}`,t:'amt',v:bg(c,cur)||''},{k:'sc',l:'Ne zaman geçerli olsun?',o:[['all','Her ay (varsayılan)'],['m','Sadece '+MN[+cur.slice(5)-1]+' ayı']],v:o?'m':'all'}],r=>{const a=num(r.a);if(r.sc=='m'){S.mb=S.mb||{};(S.mb[cur]=S.mb[cur]||{})[id]=a}else{c.bud=a;if(S.mb[cur])delete S.mb[cur][id]}})}
function mbSet(id){const c=cat(id);sheet(`${c.e} ${c.n}: ${MN[+cur.slice(5)-1]} bütçesi`,[{k:'a',l:'Bu aya özel bütçe (€)',t:'amt',v:bg(c,cur)||''}],o=>{S.mb=S.mb||{};(S.mb[cur]=S.mb[cur]||{})[id]=num(o.a)})}
function mbPrev(id){S.mb=S.mb||{};(S.mb[cur]=S.mb[cur]||{})[id]=bg(cat(id),sm(cur,-1));save();R()}
function mbClr(id){delete S.mb[cur][id];save();R()}
function mbAll(){S.mb=S.mb||{};const o=S.mb[cur]=S.mb[cur]||{};S.cats.filter(c=>c.type=='out').forEach(c=>o[c.id]=bg(c,sm(cur,-1)));save();R();toast('Geçen ayın bütçesi bu aya uygulandı')}

const ME='Ben',LK={lent:['Ona borç verdim',1],borrow:['Ondan borç aldım',-1],theypaid:['O bana ödedi',-1],ipaid:['Ben ona ödedim',1]};
let dv='led',gid=null,lo={};
const en=n=>encodeURIComponent(n).replace(/'/g,'%27'),lb=()=>{const b={};S.led.forEach(e=>b[e.who]=(b[e.who]||0)+e.a);return b};
const tg=k=>{lo[k]=!lo[k];R()},nz=v=>Math.abs(v)<.005,dm=d=>d.split('-').reverse().join('.');
function dl(){if(!S.led.length)return'';const p=Object.values(lb());return`<div class=card onclick="v='def';dv='led';R()"><b>🤝 Borç / alacak</b><div class=m>Alacağın ${f(sum(p.filter(x=>x>.005)))} · Borcun ${f(-sum(p.filter(x=>x<-.005)))}</div></div>`}
function defter(){return`<h2>Defter</h2><div class=row style="margin-bottom:10px"><button class="b s ${dv=='led'?'':'g'}" onclick="dv='led';R()">Borç / Alacak</button><button class="b s ${dv=='grp'?'':'g'}" onclick="dv='grp';gid=null;R()">Ortak harcama</button></div>`+(dv=='led'?ledv():gid?grpd():grpl())}
function ledv(){const b=lb(),p=Object.entries(b).sort((x,y)=>(nz(x[1])-nz(y[1]))||Math.abs(y[1])-Math.abs(x[1])),al=sum(p.filter(x=>x[1]>.005).map(x=>x[1])),bo=-sum(p.filter(x=>x[1]<-.005).map(x=>x[1]));
return`<div class=g2><div class=card><div class=m>Alacağın</div><b class=in>${f(al)}</b></div><div class=card><div class=m>Borcun</div><b class=out>${f(bo)}</b></div></div><div class=card><div class=m>Net durum</div><div class=big>${f(al-bo)}</div></div><button class="b s" onclick="ledSheet()">+ Yeni kayıt</button><h3></h3>`+(p.length?p.map(([n,x])=>{const k=en(n);return`<div class=card><div class="row sp" style="cursor:pointer" onclick="tg('${k}')"><b>${esc(n)}</b><span class="${nz(x)?'m':x>0?'in':'out'}">${nz(x)?'Hesap kapalı ✅':x>0?f(x)+' sana borçlu':f(-x)+' borcun var'} ${lo[k]?'▲':'▼'}</span></div>${lo[k]?`<div style="margin-top:8px">${S.led.filter(e=>e.who==n).sort((a,c)=>c.date.localeCompare(a.date)).map(e=>`<div class=it onclick="ledSheet('${e.id}')"><div><b>${LK[e.k][0]}</b><small>${dm(e.date)}${e.note?' · '+esc(e.note):''}</small></div><b class="${e.a>0?'in':'out'}">${e.a>0?'+':'−'}${f(Math.abs(e.a))}</b></div>`).join('')}<button class="b s" style="margin-top:8px" onclick="ledSheet(null,'${k}')">${nz(x)?'+ Yeni kayıt':x>0?'✔ Ödeme aldım':'✔ Ödeme yaptım'}</button></div>`:''}</div>`}).join(''):'<div class="card emp">Henüz kayıt yok. “+ Yeni kayıt” ile borç verdiğin ya da aldığın kişiyi ekle. Ödemeleri de aynı yerden kaydedersin.</div>')}
function ledSheet(id,who){const ed=id&&S.led.find(x=>x.id==id),n=ed?ed.who:who?decodeURIComponent(who):'',bv=lb()[n]||0,e=ed||{k:bv>0?'theypaid':bv<0?'ipaid':'lent',a:who?Math.abs(bv)||'':'',date:td(),note:''};
